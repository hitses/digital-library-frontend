<main class="mx-auto mt-8 max-w-6xl">
  <books-section-component
    [title]="'Destacados'"
    [books]="featuredBooks()"
    [bookType]="'destacados'"
    [loading]="loadingFeatured()"
  />

  <books-section-component [title]="'Nuevos'" [books]="newBooks()" [bookType]="'nuevos'"
    [loading]="loadingNew()"
  />

  <books-section-component
    [title]="'Populares'"
    [books]="popularBooks()"
    [bookType]="'populares'"
    [loading]="loadingPopular()"
  />
</main>
